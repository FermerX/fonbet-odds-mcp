name: Python tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, 'feature/**', 'fix/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e .
      - name: Check syntax
        run: python -m compileall -q src tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke import unauthenticated server
        run: python -c "from fonbet_mcp.server import mcp"
      - name: Smoke import OAuth-protected server
        env:
          MCP_AUTH_MODE: oauth
          MCP_OAUTH_ISSUER: https://auth.example.test
          MCP_OAUTH_RESOURCE_URL: https://fonbet.example.test/mcp
          MCP_OAUTH_JWKS_URL: https://auth.example.test/.well-known/jwks.json
        run: python -c "from fonbet_mcp.server import mcp"
