name: Extended market summary tests
on:
  pull_request:
    paths:
      - "src/fonbet_mcp/summary.py"
      - "src/fonbet_mcp/server.py"
      - "tests/test_expanded_summary.py"
      - ".github/workflows/extended-markets-tests.yml"
  push:
    branches:
      - "feature/expanded-football-markets-20261124"
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p "test_expanded_summary.py"
