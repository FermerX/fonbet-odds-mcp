name: Independent football statistics tests
on:
  pull_request:
    paths:
      - "src/fonbet_mcp/football_stats.py"
      - "src/fonbet_mcp/server.py"
      - "tests/test_football_stats.py"
      - ".github/workflows/football-stats-tests.yml"
  push:
    branches:
      - "feature/football-stats-foundation-20261125"
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p "test_football_stats.py"
      - run: python -m unittest discover -s tests -p "test_candidates.py"
      - run: python -m unittest discover -s tests -p "test_expanded_summary.py"
